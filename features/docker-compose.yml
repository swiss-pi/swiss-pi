services:
  cowrie:
    build: ./cowrie
    container_name: swisspi-cowrie
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "22:2222"
      - "23:2223"
    volumes:
      - ./cowrie/log:/cowrie/cowrie-git/var/log/cowrie
      - ./cowrie/etc:/cowrie/cowrie-git/etc/cowrie.default.cfg:ro
      - ./cowrie/downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads